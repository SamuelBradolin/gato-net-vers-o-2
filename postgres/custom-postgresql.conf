# ====================================================================
# GATO NET — CONFIGURAÇÃO POSTGRESQL 16 OTIMIZADA PARA VPS VIRTARIX
# VPS: Ubuntu 24.04 LTS | 3 vCPU | 6 GB RAM | 50 GB NVMe SSD
# ====================================================================

# Conexões e Rede
listen_addresses = '*'
max_connections = 100

# Memória (Base: 6 GB RAM na VPS, reservando 1.5 GB para PostgreSQL e o restante para Node.js/Nginx/SO)
shared_buffers = 1536MB                  # 25% da memória RAM total
effective_cache_size = 4608MB            # 75% da RAM total estimada para cache do SO
work_mem = 8MB                           # Memória por operação de ordenação/hash
maintenance_work_mem = 256MB             # Memória para VACUUM, CREATE INDEX e migrações

# Armazenamento em Disco NVMe SSD
random_page_cost = 1.1                   # Custo baixo de I/O em disco SSD NVMe
effective_io_concurrency = 200           # Concorrência otimizada para armazenamento NVMe

# Write-Ahead Logging (WAL) & Checkpoints
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9       # Distribui o I/O do checkpoint ao longo do ciclo

# Planejador de Consultas
default_statistics_target = 100

# Logs e Auditoria
log_timezone = 'UTC'
datestyle = 'iso, ymd'
timezone = 'UTC'
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '

# Autovacuum (Manutenção de Tabelas e Índices)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
